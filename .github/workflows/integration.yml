name: Integration

on:
  push:
    branches:
      - develop

jobs:
  integration:
    name: Full-Stack Integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose -f infra/docker-compose.yml up -d --build

      - name: Wait for services to be ready
        run: sleep 15

      - name: Health check — all services must return 200 with status ok
        run: |
          for port in 8001 8002 8003 8004; do
            response=$(curl -sf "http://localhost:${port}/health")
            echo "Port $port: $response"
            echo "$response" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data.get('status') == 'ok', f'Expected status ok, got: {data}'
          "
          done

      - name: Run mock pipeline (EEP → IEP1 → IEP2 → IEP3)
        run: |
          response=$(curl -sf -X POST http://localhost:8001/run \
            -H "Content-Type: application/json" \
            -d '{"video_path": "test_video.mp4"}')
          echo "Pipeline response: $response"
          echo "$response" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert 'pdf_url' in data, f'Missing pdf_url in response: {data}'
          assert data['pdf_url'], f'pdf_url is empty: {data}'
          assert 'run_id' in data, f'Missing run_id in response: {data}'
          print('Mock pipeline passed — pdf_url:', data['pdf_url'])
          "

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
