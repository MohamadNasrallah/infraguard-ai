apiVersion: apps/v1
kind: Deployment
metadata:
  name: iep3
  namespace: infraguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iep3
  template:
    metadata:
      labels:
        app: iep3
    spec:
      containers:
        - name: iep3
          image: ghcr.io/${{ github.repository_owner }}/infraguard-iep3:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: infraguard-db-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
